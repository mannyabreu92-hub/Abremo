<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>Sign in to Abremi</title></head>
<body style="margin:0;padding:0;background:#0b0c0d;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0b0c0d;">
  <tr><td align="center" style="padding:40px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#121314;border:1px solid #3a3326;border-radius:20px;">
      <tr><td align="center" style="padding:36px 32px 8px;">
        <img src="https://abremi.app/icons/icon-192.png" width="56" height="56" alt="" style="display:block;border:0;border-radius:14px;">
        <p style="margin:14px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:26px;letter-spacing:.5px;color:#f3efe7;">Abremi</p>
      </td></tr>
      <tr><td align="center" style="padding:20px 32px 0;">
        <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1.35;color:#f3efe7;">Sign in to Abremi</p>
        <p style="margin:12px 0 0;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#b9b3a8;">Type this code on Abremi, or tap the button below.</p>
      </td></tr>
      <tr><td align="center" style="padding:24px 32px 0;">
        <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8c867c;">Your code</p>
        <p style="margin:8px 0 0;font-family:'Courier New',Courier,monospace;font-size:34px;font-weight:bold;letter-spacing:8px;color:#d6ad68;">{{ .Token }}</p>
      </td></tr>
      <tr><td align="center" style="padding:26px 32px 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td align="center" bgcolor="#d6ad68" style="border-radius:999px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 34px;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#14110b;text-decoration:none;border-radius:999px;">Sign in</a>
          </td></tr></table>
      </td></tr>
      <tr><td align="center" style="padding:28px 32px 34px;">
        <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#8c867c;">The code and button work once and expire soon. If you didn’t ask to sign in, you can ignore this email.</p>
      </td></tr>
    </table>
    <p style="margin:20px 0 0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#6b665e;">Abremi · Discover, collect and rank contemporary art · <a href="https://abremi.app" style="color:#8c867c;">abremi.app</a></p>
  </td></tr>
</table>
</body>
</html>
