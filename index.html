<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b14">
  <meta name="description" content="Gabangi — swipe, discover and rank art. The Tinder and TikTok of art.">
  <title>Gabangi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff4f7b'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Georgia' fill='white'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/ui/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="logo" href="#discover">gabangi</a>
      <a class="role-pill" id="role-pill" href="#profile" title="Your role and vote weight"></a>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Main">
      <a href="#discover" data-view="discover"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.3-9A5.3 5.3 0 0 1 12 6a5.3 5.3 0 0 1 9.3 6C19 16.5 12 21 12 21z"/></svg><span>Discover</span></a>
      <a href="#battle" data-view="battle"><svg viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M14.5 6.5L18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/></svg><span>Battle</span></a>
      <a href="#charts" data-view="charts"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg><span>Charts</span></a>
      <a href="#scan" data-view="scan"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3.5"/></svg><span>Scan</span></a>
      <a href="#profile" data-view="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></a>
    </nav>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-act="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <button class="sheet-close" data-act="close-sheet" aria-label="Close">✕</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>Gabangi needs JavaScript to run.</noscript>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
