<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090A">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Abremi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Abremi — discover, collect and rank contemporary art. Every work, ranked by taste.">
  <title>Abremi</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="src/ui/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="#home" aria-label="Abremi home"><span class="abremi-logo"><svg class="abremi-symbol" width="26" height="26" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M15.3 3.2 3.6 28.8h6.2L17.9 9.6z"/><path d="M16.4 3.2h2.1l10 25.6h-2.2z"/><path d="M10.6 20.3h13.4l.6 1.7H10z"/></svg><span class="brand-word">Abremi</span></span></a>
      <nav class="nav-links" aria-label="Primary">
        <a href="#discover" data-view="discover">Discover</a>
        <a href="#explore" data-view="explore">Explore</a>
        <a href="#battle" data-view="battle">Arena</a>
        <a href="#charts" data-view="charts">Rankings</a>
        <a href="#artists" data-view="artists">Artists</a>
        <a href="#collections" data-view="collections">Collections</a>
      </nav>
      <div class="nav-tools">
        <button class="nav-search" data-act="open-search" aria-label="Search (press /)">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <span>Search</span><kbd>/</kbd>
        </button>
        <a class="icon-btn" href="#scan" data-view="scan" aria-label="Scan artwork" title="Scan artwork">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3"/></svg>
        </a>
        <div class="popover-wrap">
          <button class="icon-btn" id="notif-btn" data-act="toggle-notifications" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></svg>
            <span class="dot" id="notif-dot" hidden></span>
          </button>
          <div class="popover" id="notifications" role="menu" hidden></div>
        </div>
        <a class="nav-profile" href="#profile" data-view="profile" id="nav-profile" aria-label="Profile"></a>
        <div class="popover-wrap nav-menu-wrap">
          <button class="icon-btn" data-act="toggle-menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false" id="menu-btn">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="popover popover-menu" id="menu" role="menu" hidden>
            <a href="#home" role="menuitem">Home</a>
            <a href="#explore" role="menuitem">Explore</a>
            <a href="#artists" role="menuitem">Artists</a>
            <a href="#collections" role="menuitem">Collections</a>
            <a href="#scan" role="menuitem">Scan artwork</a>
            <a href="#profile" role="menuitem">Profile &amp; plans</a>
            <a href="#opportunities" role="menuitem">Opportunities</a>
            <a href="#inbox" role="menuitem" id="menu-inbox" hidden>Inbox</a>
            <a href="#admin" role="menuitem" id="menu-admin" hidden>Review applications</a>
            <button role="menuitem" data-act="pwa-install" id="menu-install" hidden>Install the app</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <div class="shell"><div class="skel skel-hero"></div>
      <div class="art-grid" aria-busy="true"><div class="skel-card"><div class="skel skel-img"></div><div class="skel skel-line"></div></div><div class="skel-card"><div class="skel skel-img"></div><div class="skel skel-line"></div></div><div class="skel-card"><div class="skel skel-img"></div><div class="skel skel-line"></div></div></div>
    </div>
  </main>

  <nav class="tabbar" aria-label="Primary mobile">
    <a href="#discover" data-view="discover"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg><span>Discover</span></a>
    <a href="#battle" data-view="battle"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20.5h8M12 16.5v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1.5a3 3 0 0 0 3 3M17 6h3v1.5a3 3 0 0 1-3 3"/></svg><span>Arena</span></a>
    <a href="#charts" data-view="charts"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V11M12 20V5M18 20v-6M3.5 20.5h17"/></svg><span>Rankings</span></a>
    <a href="#collections" data-view="collections"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg><span>Collections</span></a>
    <a href="#profile" data-view="profile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg><span>Profile</span></a>
  </nav>

  <div class="modal" id="sheet" hidden>
    <div class="modal-backdrop" data-act="close-sheet"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close icon-btn" data-act="close-sheet" aria-label="Close"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div class="modal modal-search" id="search" hidden>
    <div class="modal-backdrop" data-act="close-search"></div>
    <div class="modal-panel search-panel" role="dialog" aria-modal="true" aria-label="Search">
      <div id="search-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="shell">Abremi needs JavaScript to run.</p></noscript>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
